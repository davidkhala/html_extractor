name: Release Dify Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      
      - uses: davidkhala/uv-buildpack@main
        with:
            test-entry-point: pytest
      - name: Download dify-plugin-daemon
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/langgenius/dify-plugin-daemon/releases/latest)
          DOWNLOAD_URL=$(echo $LATEST_RELEASE | jq -r '.assets[] | select(.name | contains("x86_64-unknown-linux-gnu")) | .browser_download_url' | head -1)
          curl -L -o ../dify $DOWNLOAD_URL
          chmod +x ../dify
          ../dify --version
      - name: Generate requirements.txt (consumed by dify)
        run: uv pip compile pyproject.toml -o requirements.txt
      
      - name: Build Dify plugin package
        run: |
          cd ..
          ./dify plugin package "$REPO_NAME"
          mv "$REPO_NAME.difypkg" "${GITHUB_WORKSPACE}/$REPO_NAME.difypkg"
      
      - name: Get tag name
        id: tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.REPO_NAME }}.difypkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
