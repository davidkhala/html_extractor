identity:
  name: html_extractor
  author: davidkhala
  label:
    en_US: HTML Extractor
    zh_Hans: HTML 文本提取器
description:
  human:
    en_US: HTML Extractor
  llm: HTML Extractor
parameters:
  - name: html
    type: string
    required: true
    label:
      en_US: html text
    human_description:
      en_US: the HTML content to be parsed
      zh_Hans: 要解析的HTML字符串内容
      pt_BR: o conteúdo HTML a ser analisado
    llm_description: the HTML content to be parsed
    form: llm
  - name: header_class
    type: string
    required: false
    label:
      en_US: header classes
    human_description:
      en_US: header classes to be removed. concatenated by ','
    llm_description: css classes concatenated by ','. <div> with specified classes will be remove. If not empty, <header> will be removed also
    form: llm
  - name: footer_class
    type: string
    required: false
    label:
      en_US: footer classes
    human_description:
      en_US: footer classes to be removed. concatenated by ','
    llm_description: css classes concatenated by ','. <div> with specified classes will be remove. If not empty, <footer> will be removed also
    form: llm
extra:
  python:
    source: tools/__init__.py
