identity:
  name: html_extractor
  author: davidkhala
  label:
    en_US: HTML Extractor
    zh_Hans: HTML 文本提取器
description:
  human:
    en_US: HTML Extractor
  llm: HTML Extractor
parameters:
  - name: html
    type: string
    required: true
    label:
      en_US: html text
    human_description:
      en_US: the HTML content to be parsed
      zh_Hans: 要解析的HTML字符串内容
      pt_BR: o conteúdo HTML a ser analisado
    llm_description: the HTML content to be parsed
    form: llm
  - name: remove_header
    type: boolean
    required: false
    default: true
    label:
      en_US: Remove <header> tag
    human_description:
      en_US: Whether to remove the <header> section from the HTML
      zh_Hans: 是否移除HTML中的<header>部分
      pt_BR: Remover a seção <header> do HTML
    llm_description: Whether to remove the <header> section from the HTML
    form: llm
  - name: remove_footer
    type: boolean
    required: false
    default: true
    label:
      en_US: Remove <footer> tag
    human_description:
      en_US: Whether to remove the <footer> section from the HTML
      zh_Hans: 是否移除HTML中的<footer>部分
      pt_BR: Remover a seção <footer> do HTML
    llm_description: Whether to remove the <footer> section from the HTML
    form: llm
output_schema:

extra:
  python:
    source: tools/extractor.py
